<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Kouros: a saved ComfyUI workflow is compiled, shown as a form, queued on your server, and the result lands in the gallery"><rect width="1200" height="330" rx="16" fill="#0d1117" stroke="#30363d"/><text x="60" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="38" font-weight="700" fill="#e6edf3">kouros</text><text x="60" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Run the ComfyUI workflows already on your server from an Android phone, and follow them live.</text><rect x="60" y="170" width="180" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="150.0" y="200" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">saved workflow</text><text x="150.0" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">/userdata</text><rect x="285" y="170" width="180" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="375.0" y="200" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">compile</text><text x="375.0" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">UI graph → prompt</text><line x1="240" y1="205.0" x2="278" y2="205.0" stroke="#8b949e" stroke-width="1.8"/><path d="M277,200.0 L285,205.0 L277,210.0 Z" fill="#8b949e"/><rect x="510" y="170" width="180" height="70" rx="10" fill="#161b22" stroke="#e08a61" stroke-width="1.5"/><text x="600.0" y="200" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">form</text><text x="600.0" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">/object_info</text><line x1="465" y1="205.0" x2="503" y2="205.0" stroke="#8b949e" stroke-width="1.8"/><path d="M502,200.0 L510,205.0 L502,210.0 Z" fill="#8b949e"/><rect x="735" y="170" width="180" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="825.0" y="200" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">your ComfyUI</text><text x="825.0" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">/prompt · /ws</text><line x1="690" y1="205.0" x2="728" y2="205.0" stroke="#8b949e" stroke-width="1.8"/><path d="M727,200.0 L735,205.0 L727,210.0 Z" fill="#8b949e"/><rect x="960" y="170" width="180" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="1050.0" y="200" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">gallery</text><text x="1050.0" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">/view · notification</text><line x1="915" y1="205.0" x2="953" y2="205.0" stroke="#8b949e" stroke-width="1.8"/><path d="M952,200.0 L960,205.0 L952,210.0 Z" fill="#8b949e"/><text x="60" y="284" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Nodes, models and custom packs are read from your server, not built into the